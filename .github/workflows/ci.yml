name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  notebooks:
    name: Ноутбуки запускаются
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # A reader on Windows who cannot run the notebook has no course, so
        # Windows is checked on every push rather than assumed to work.
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # Executed to a throwaway copy: the point is that they still run, not to
      # rewrite the committed outputs on every push.
      - name: Выполнить каждый ноутбук
        shell: bash
        run: |
          for nb in notebooks/*.ipynb; do
            echo "::group::$nb"
            jupyter nbconvert --to notebook --execute \
              --ExecutePreprocessor.timeout=600 \
              --output-dir "$RUNNER_TEMP/executed" "$nb"
            echo "::endgroup::"
          done

  site:
    name: Сайт собирается
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # --strict fails on a broken internal link or a page missing from the
      # navigation, which is the breakage nobody notices until a reader hits it.
      - run: mkdocs build --strict

      # mkdocs does not check outbound links, so neither --strict nor the
      # notebook job would notice a module pointing at a notebook that is not
      # there, a notebook no page links to, or a page that lost its "open in
      # Colab" link. Standard library only, so this adds nothing to install.
      - name: Модули ведут к своим ноутбукам
        run: python scripts/check_modules.py

      # Теги Open Graph отдаёт шаблон, а не страница: сборка проходит и с
      # пустым заголовком (при 404 `page` пуста), и с картинкой, которой уже
      # нет, и с заголовком, выведенным дважды. Проверяется по собранному
      # каталогу, поэтому шаг идёт после mkdocs build.
      - name: У каждой страницы есть что показать, когда ей делятся
        run: python scripts/check_social.py site

  ci:
    name: CI
    runs-on: ubuntu-latest
    if: always()
    needs: [notebooks, site]
    steps:
      # One aggregate check to require in branch protection. Without it, adding
      # an operating system to the notebook matrix silently leaves it
      # unrequired, and a red job stops blocking merges.
      - name: Fail if any job did not succeed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "One or more jobs failed:"
          echo '${{ toJSON(needs) }}'
          exit 1
      - run: echo "All checks passed."
