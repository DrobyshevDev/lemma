version: 2

updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "deps"
    # numpy and matplotlib are pinned by a *lower* bound on purpose: it says
    # which versions a reader may already have, not which version CI runs. pip
    # installs the newest match either way, so raising the floor buys nothing
    # and locks readers out.
    #
    # update-types is not enough here: for a `>=` constraint Dependabot files a
    # "requirement update", which that filter does not match, and it raised the
    # floor to 2.5.1 anyway. Hence the unconditional ignore.
    ignore:
      - dependency-name: numpy
      - dependency-name: matplotlib
    groups:
      docs-and-notebooks:
        patterns: ["mkdocs*", "jupyter", "nbconvert", "nbformat", "ipykernel", "matplotlib"]
    open-pull-requests-limit: 5
