site_name: lemma
site_description: >-
  Бесплатный курс по машинному обучению, нейросетям, обучению с подкреплением и
  рекомендательным системам. Двадцать семь модулей: от арифметики среднего до
  воспроизведения свежей статьи.
site_url: https://drobyshevdev.github.io/lemma/
repo_url: https://github.com/DrobyshevDev/lemma
repo_name: DrobyshevDev/lemma
edit_uri: edit/main/docs/
copyright: Текст — CC BY 4.0, код — MIT.

theme:
  name: material
  custom_dir: overrides
  language: ru
  # The theme otherwise pulls Roboto from Google Fonts on every page load. The
  # typography here is a system stack set in theme.css, so that request buys
  # the reader nothing and costs them a third party.
  font: false
  features:
    # navigation.instant is deliberately absent: it swaps the page without a
    # reload, and the landing template's layout does not survive that.
    - navigation.tracking
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - content.code.copy
    - content.code.annotate
    - content.action.edit
    - search.suggest
    - search.highlight
    - toc.follow
  # One scheme, dark. A toggle would mean designing the whole thing twice, and
  # the second design is always the one nobody checks.
  palette:
    scheme: slate
    primary: black
    accent: indigo
  icon:
    repo: fontawesome/brands/github

plugins:
  - search:
      lang: ru

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.caret
  - pymdownx.tilde
  - pymdownx.arithmatex:
      generic: true

extra_javascript:
  - assets/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

extra_css:
  - assets/theme.css

nav:
  - Курс: index.md
  - Начало:
      - Программа: programme.md
      - Пререквизиты: prerequisites.md
      - Как учиться: how-to-study.md
  - Часть I. Как проверяют утверждения:
      - "Модуль 1. Что значит «работает»": modules/01-claim-baseline-noise.md
      - "Модуль 2. Данные и вероятность": modules/02-data-and-probability.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/DrobyshevDev/lemma
