site_name: lemma
site_description: >-
  Бесплатный курс по машинному обучению, нейросетям, обучению с подкреплением и
  рекомендательным системам. Двадцать семь модулей: от арифметики среднего до
  воспроизведения свежей статьи.
site_url: https://drobyshevdev.github.io/lemma/
repo_url: https://github.com/DrobyshevDev/lemma
repo_name: DrobyshevDev/lemma
edit_uri: edit/main/docs/
copyright: Текст — CC BY 4.0, код — MIT.

theme:
  name: material
  custom_dir: overrides
  language: ru
  # The theme otherwise pulls Roboto from Google Fonts on every page load. The
  # typography here is a system stack set in theme.css, so that request buys
  # the reader nothing and costs them a third party.
  font: false
  features:
    # navigation.instant is deliberately absent: it swaps the page without a
    # reload, and the landing template's layout does not survive that.
    - navigation.tracking
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - content.code.copy
    - content.code.annotate
    - content.action.edit
    - search.suggest
    - search.highlight
    - toc.follow
  # One scheme, dark. A toggle would mean designing the whole thing twice, and
  # the second design is always the one nobody checks.
  palette:
    scheme: slate
    primary: black
    accent: indigo
  icon:
    repo: fontawesome/brands/github

plugins:
  - search:
      lang:
        - ru
        - en
  # Английская версия — стандарт организации. Одна страница на язык (page.en.md
  # рядом с page.md), а не форк: непереведённая страница показывается на языке по
  # умолчанию, поэтому сайт целостен на любом этапе перевода.
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: ru
          name: Русский
          default: true
          build: true
        - locale: en
          name: English
          build: true
          site_name: lemma
          site_description: >-
            A free course on machine learning, neural networks, reinforcement
            learning and recommender systems. Twenty-seven modules, from the
            arithmetic of the mean to reproducing a fresh paper.
          nav_translations:
            Курс: Course
            Начало: Getting started
            Программа: Programme
            Пререквизиты: Prerequisites
            Как учиться: How to study
            "Часть I. Как проверяют утверждения": "Part I. How claims are checked"
            "Модуль 1. Что значит «работает»": "Module 1. What “works” means"
            "Модуль 2. Данные и вероятность": "Module 2. Data and probability"
            "Модуль 3. Линейная алгебра как язык": "Module 3. Linear algebra as a language"
            "Модуль 4. Производные и оптимизация": "Module 4. Derivatives and optimisation"
            "Часть II. Базовые линии": "Part II. Baselines"
            "Модуль 5. Линейные модели и метрики": "Module 5. Linear models and metrics"
            "Модуль 6. Деревья и ансамбли": "Module 6. Trees and ensembles"
            "Модуль 7. Честное сравнение": "Module 7. Honest comparison"
            "Часть III. Нейросети": "Part III. Neural networks"
            "Модуль 8. Полносвязные сети и backprop": "Module 8. Fully connected networks and backprop"
            "Модуль 9. Свёртки и представления": "Module 9. Convolutions and representations"
            "Модуль 10. Последовательности и внимание": "Module 10. Sequences and attention"
            "Модуль 11. Языковые модели": "Module 11. Language models"
            "Часть IV. Обучение с подкреплением и психология": "Part IV. Reinforcement learning and psychology"
            "Модуль 12. Среда, награда, политика": "Module 12. Environment, reward, policy"
            "Модуль 13. TD-обучение и дофамин": "Module 13. TD learning and dopamine"
            "Модуль 14. Policy gradient и современные методы": "Module 14. Policy gradient and modern methods"
            "Модуль 15. RL там, где есть цена ошибки": "Module 15. RL where a mistake has a cost"
            "Модуль 16. Награда как спецификация": "Module 16. Reward as a specification"
            "Часть V. Рекомендательные системы и внимание": "Part V. Recommender systems and attention"
            "Модуль 17. Коллаборативная фильтрация": "Module 17. Collaborative filtering"
            "Модуль 18. Нейронные рекомендатели и ранжирование": "Module 18. Neural recommenders and ranking"

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.caret
  - pymdownx.tilde
  - pymdownx.arithmatex:
      generic: true

extra_javascript:
  - assets/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js
  # Гидрирует интерактивные фигуры (data-lm-fig). Без зависимостей, палитру
  # берёт из тех же переменных, что и тема.
  - assets/lemma-viz.js

extra_css:
  - assets/theme.css

nav:
  - Курс: index.md
  - Начало:
      - Программа: programme.md
      - Пререквизиты: prerequisites.md
      - Как учиться: how-to-study.md
  - Часть I. Как проверяют утверждения:
      - "Модуль 1. Что значит «работает»": modules/01-claim-baseline-noise.md
      - "Модуль 2. Данные и вероятность": modules/02-data-and-probability.md
      - "Модуль 3. Линейная алгебра как язык": modules/03-linear-algebra.md
      - "Модуль 4. Производные и оптимизация": modules/04-derivatives-and-optimisation.md
  - "Часть II. Базовые линии":
      - "Модуль 5. Линейные модели и метрики": modules/05-linear-models-and-metrics.md
      - "Модуль 6. Деревья и ансамбли": modules/06-trees-and-ensembles.md
      - "Модуль 7. Честное сравнение": modules/07-honest-comparison.md
  - "Часть III. Нейросети":
      - "Модуль 8. Полносвязные сети и backprop": modules/08-neural-networks-and-backprop.md
      - "Модуль 9. Свёртки и представления": modules/09-convolutions.md
      - "Модуль 10. Последовательности и внимание": modules/10-sequences-and-attention.md
      - "Модуль 11. Языковые модели": modules/11-language-models.md
  - "Часть IV. Обучение с подкреплением и психология":
      - "Модуль 12. Среда, награда, политика": modules/12-environment-reward-policy.md
      - "Модуль 13. TD-обучение и дофамин": modules/13-td-learning-and-dopamine.md
      - "Модуль 14. Policy gradient и современные методы": modules/14-policy-gradient.md
      - "Модуль 15. RL там, где есть цена ошибки": modules/15-rl-with-a-cost.md
      - "Модуль 16. Награда как спецификация": modules/16-reward-as-specification.md
  - "Часть V. Рекомендательные системы и внимание":
      - "Модуль 17. Коллаборативная фильтрация": modules/17-collaborative-filtering.md
      - "Модуль 18. Нейронные рекомендатели и ранжирование": modules/18-neural-recommenders-and-ranking.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/DrobyshevDev/lemma
